[package]
name = "blockwise"
version = "0.1.0"
edition = "2024"
description = "Fast, dark, keyboard-driven disk usage visualizer (tree + cushion treemap) built on GPUI"
license = "MIT"
repository = "https://github.com/Guillermode20/blockwise"
readme = "README.md"
keywords = ["disk-usage", "treemap", "gpui", "filesystem"]
categories = ["filesystem", "visualization"]

[[bin]]
name = "blockwise"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
rayon = "1.12"
rfd = "0.15"
dirs = "5.0"
flume = "0.11"
open = "5.4"
image = { version = "0.25", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# xattr 0.2.3 (via gpui -> zed-async-tar) uses libc::ENOATTR, which current
# libc no longer exports on Linux; the vendored copy maps it to ENODATA.
[patch.crates-io]
xattr = { path = "vendor/xattr-0.2.3" }
